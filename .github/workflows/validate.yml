name: Validate examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate deterministic examples
        run: python3 scripts/validate_examples.py
      - name: Validate catalog cards
        run: python3 scripts/generate_catalog_cards.py --check
