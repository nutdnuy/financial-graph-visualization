<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Performance waterfall preview</title>
  <desc id="desc">An illustrative waterfall from 100 to 112 with contributions, market return, fees, and withdrawals.</desc>
  <rect width="1200" height="620" fill="#121212"/>
  <text x="56" y="62" fill="#03dac6" font-family="Arial" font-size="16" font-weight="700" letter-spacing="2">EXAMPLE 02 · DECOMPOSITION</text>
  <text x="56" y="108" fill="#ffffff" fill-opacity=".87" font-family="Arial" font-size="42" font-weight="600">Performance waterfall</text>
  <rect x="56" y="140" width="1088" height="410" rx="12" fill="#1e1e1e" stroke="#ffffff" stroke-opacity=".16"/>
  <g stroke="#ffffff" stroke-opacity=".14"><line x1="120" x2="1090" y1="242" y2="242"/><line x1="120" x2="1090" y1="304" y2="304"/><line x1="120" x2="1090" y1="366" y2="366"/><line x1="120" x2="1090" y1="428" y2="428"/><line x1="120" x2="1090" y1="490" y2="490"/></g>
  <g fill="#ffffff" fill-opacity=".60" font-family="Arial" font-size="13" text-anchor="end"><text x="108" y="247">120</text><text x="108" y="309">110</text><text x="108" y="371">100</text><text x="108" y="433">90</text><text x="108" y="495">80</text></g>
  <g fill="#bb86fc"><rect x="150" y="366" width="130" height="124" rx="5"/><rect x="930" y="292" width="130" height="198" rx="5"/></g>
  <g fill="#03dac6"><rect x="314" y="292" width="130" height="74" rx="5"/><rect x="478" y="242" width="130" height="50" rx="5"/></g>
  <g fill="#cf6679"><rect x="642" y="292" width="130" height="18" rx="5"/><rect x="806" y="310" width="130" height="18" rx="5"/></g>
  <g fill="#ffffff" fill-opacity=".87" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle"><text x="215" y="350">100</text><text x="379" y="276">+12</text><text x="543" y="226">+8</text><text x="707" y="276">−3</text><text x="871" y="294">−5</text><text x="995" y="270">112</text></g>
  <g fill="#ffffff" fill-opacity=".60" font-family="Arial" font-size="13" text-anchor="middle"><text x="215" y="525">Start</text><text x="379" y="525">Contributions</text><text x="543" y="525">Market return</text><text x="707" y="525">Fees</text><text x="871" y="525">Withdrawals</text><text x="995" y="525">End</text></g>
  <text x="1080" y="180" fill="#ffffff" fill-opacity=".60" font-family="Arial" font-size="13" text-anchor="end">Value index · synthetic one-year period</text>
</svg>
