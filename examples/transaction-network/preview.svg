    <line x1="470" y1="345" x2="743.6" y2="285.7" stroke="#03dac6" stroke-opacity=".62" stroke-width="3.6"/>
    <line x1="330" y1="420" x2="228.2" y2="301.3" stroke="#bb86fc" stroke-opacity=".62" stroke-width="2.95" stroke-dasharray="7 6"/>
    <line x1="330" y1="420" x2="447.1" y2="357.3" stroke="#bb86fc" stroke-opacity=".62" stroke-width="2.95" stroke-dasharray="7 6"/>
    <line x1="650" y1="425" x2="487.0" y2="212.2" stroke="#bb86fc" stroke-opacity=".62" stroke-width="2.3" stroke-dasharray="7 6"/>
    <line x1="650" y1="425" x2="752.8" y2="300.8" stroke="#bb86fc" stroke-opacity=".62" stroke-width="2.3" stroke-dasharray="7 6"/>
