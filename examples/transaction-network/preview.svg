  <g fill="#ffffff" fill-opacity=".87" font-family="Arial" font-size="14" text-anchor="middle"><text x="210" y="318">Alpha Co</text><text x="470" y="228">Beta Co</text><text x="470" y="383">Gamma Co</text><text x="770" y="318">Delta Co</text><text x="330" y="456">Owner 1</text><text x="650" y="461">Owner 2</text><text x="980" y="393">Review</text><text x="880" y="205">Bank</text></g>
