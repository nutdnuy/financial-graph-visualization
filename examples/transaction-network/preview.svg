<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Transaction network preview</title>
  <desc id="desc">A fixed-position directed transaction graph with company, person, risk, and institution nodes.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" fill-opacity=".62"/></marker></defs>
  <rect width="1200" height="560" fill="#121212"/>
  <text x="52" y="54" fill="#03dac6" font-family="Arial" font-size="15" font-weight="700" letter-spacing="2">EXAMPLE 03 · TOPOLOGY BEFORE LAYOUT</text>
  <text x="52" y="98" fill="#ffffff" fill-opacity=".87" font-family="Arial" font-size="38" font-weight="600">Transaction network</text>
  <rect x="52" y="124" width="1096" height="352" rx="12" fill="#1e1e1e" stroke="#ffffff" stroke-opacity=".16"/>
