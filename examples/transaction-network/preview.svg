<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Transaction network preview</title>
  <desc id="desc">A fixed-position directed transaction graph with company, person, risk, and institution nodes.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" fill-opacity=".55"/></marker></defs>
  <rect width="1200" height="660" fill="#121212"/>
  <text x="48" y="62" fill="#03dac6" font-family="Arial" font-size="16" font-weight="700" letter-spacing="2">EXAMPLE 03 · TOPOLOGY BEFORE LAYOUT</text>
  <text x="48" y="108" fill="#ffffff" fill-opacity=".87" font-family="Arial" font-size="42" font-weight="600">Transaction network</text>
  <rect x="48" y="140" width="1104" height="450" rx="12" fill="#1e1e1e" stroke="#ffffff" stroke-opacity=".16"/>
  <g fill="none" marker-end="url(#arrow)"><line x1="204" y1="320" x2="460" y2="220" stroke="#03dac6" stroke-opacity=".62" stroke-width="6.2"/><line x1="204" y1="320" x2="460" y2="430" stroke="#03dac6" stroke-opacity=".62" stroke-width="4.25"/><line x1="490" y1="220" x2="770" y2="320" stroke="#03dac6" stroke-opacity=".62" stroke-width="5.55"/><line x1="490" y1="430" x2="770" y2="320" stroke="#03dac6" stroke-opacity=".62" stroke-width="3.6"/><line x1="320" y1="510" x2="204" y2="320" stroke="#bb86fc" stroke-opacity=".62" stroke-width="2.95" stroke-dasharray="7 6"/><line x1="320" y1="510" x2="460" y2="430" stroke="#bb86fc" stroke-opacity=".62" stroke-width="2.95" stroke-dasharray="7 6"/><line x1="650" y1="530" x2="460" y2="220" stroke="#bb86fc" stroke-opacity=".62" stroke-width="2.3" stroke-dasharray="7 6"/><line x1="650" y1="530" x2="770" y2="320" stroke="#bb86fc" stroke-opacity=".62" stroke-width="2.3" stroke-dasharray="7 6"/><line x1="770" y1="320" x2="980" y2="420" stroke="#cf6679" stroke-opacity=".62" stroke-width="4.9"/><line x1="870" y1="200" x2="980" y2="420" stroke="#cf6679" stroke-opacity=".62" stroke-width="3.6"/></g>
  <g stroke="#121212" stroke-width="5"><circle cx="204" cy="320" r="24" fill="#bb86fc"/><circle cx="490" cy="220" r="23" fill="#bb86fc"/><circle cx="490" cy="430" r="21" fill="#bb86fc"/><circle cx="770" cy="320" r="22" fill="#bb86fc"/><circle cx="320" cy="510" r="20" fill="#03dac6"/><circle cx="650" cy="530" r="19" fill="#03dac6"/><circle cx="980" cy="420" r="23" fill="#cf6679"/><circle cx="870" cy="200" r="19" fill="#ffffff"/></g>
  <g fill="#ffffff" fill-opacity=".87" font-family="Arial" font-size="15" text-anchor="middle"><text x="204" y="364">Alpha Co</text><text x="490" y="264">Beta Co</text><text x="490" y="474">Gamma Co</text><text x="770" y="364">Delta Co</text><text x="320" y="554">Owner 1</text><text x="650" y="574">Owner 2</text><text x="980" y="464">Review</text><text x="870" y="244">Bank</text></g>
  <g font-family="Arial" font-size="13" fill="#ffffff" fill-opacity=".60"><circle cx="70" cy="625" r="7" fill="#bb86fc"/><text x="86" y="630">company</text><circle cx="240" cy="625" r="7" fill="#03dac6"/><text x="256" y="630">person</text><circle cx="390" cy="625" r="7" fill="#cf6679"/><text x="406" y="630">risk</text><circle cx="510" cy="625" r="7" fill="#ffffff"/><text x="526" y="630">institution</text><text x="1150" y="630" text-anchor="end">fixed positions · width = weight · dashed = shared owner</text></g>
</svg>
